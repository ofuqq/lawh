[workspace]
resolver = "2"
members = [
  "crates/ruqa-core",
  "crates/ruqa-render",
  "crates/ruqa-app",
]

[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
thiserror = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.80.0"
authors = ["Abdulrahman Hossam <ahossam.tech@gmail.com>", "Ruqa Contributors"]
license = "Apache-2.0"
repository = "https://github.com/ofuqq/ruqa"
homepage = "https://github.com/ofuqq/ruqa"
description = "A lightweight, open-source desktop whiteboard and study scratchpad in Rust."
readme = "README.md"
