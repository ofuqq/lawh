<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <!-- Background Dot Pattern -->
    <pattern id="dot-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#2E3440" opacity="0.8" />
    </pattern>
    <!-- Filter for subtle sketchy jitter simulation -->
    <filter id="hand-drawn" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="540" fill="#121212" />
  <rect width="960" height="540" fill="url(#dot-grid)" />

  <!-- Top Floating Toolbar HUD -->
  <g transform="translate(240, 20)">
    <rect width="480" height="44" rx="8" fill="#1E1E1E" stroke="#333333" stroke-width="1.5" />
    <!-- Tool Icons -->
    <g fill="#D8DEE9" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">
      <rect x="8" y="6" width="32" height="32" rx="4" fill="#2E3440" />
      <text x="18" y="27" fill="#38BDF8">V</text>
      <text x="66" y="27">P</text>
      <text x="114" y="27">R</text>
      <text x="162" y="27">D</text>
      <text x="210" y="27">O</text>
      <text x="258" y="27">L</text>
      <text x="306" y="27">A</text>
      <text x="354" y="27">E</text>
      <text x="410" y="27" fill="#888888">|</text>
      <text x="435" y="27" fill="#A78BFA">Vault</text>
    </g>
  </g>

  <!-- Left Study Vault Mini-Sidebar -->
  <g transform="translate(16, 20)">
    <rect width="180" height="500" rx="6" fill="#181818" stroke="#282828" stroke-width="1" />
    <text x="16" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#888888">STUDY VAULT</text>
    <g font-family="system-ui, sans-serif" font-size="12" fill="#ECEFF4">
      <text x="16" y="64" fill="#38BDF8">▼ algorithms/</text>
      <text x="28" y="88" fill="#FFD166">● dijkstra.ruqa</text>
      <text x="28" y="112">○ bst-tree.ruqa</text>
      <text x="16" y="144" fill="#888888">▶ distributed-systems/</text>
      <text x="16" y="174" fill="#888888">▶ networking-notes/</text>
    </g>
  </g>

  <!-- Canvas Diagram: Cache-Aside Flow with Hand-Drawn Sketch Aesthetic -->
  <g transform="translate(230, 90)" filter="url(#hand-drawn)">
    <!-- Client Node (Cyan) -->
    <rect x="50" y="60" width="130" height="70" rx="4" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-width="2.5" />
    <rect x="52" y="62" width="126" height="66" rx="4" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="8 4" />
    <text x="82" y="100" font-family="'Caveat', 'Comic Sans MS', cursive, sans-serif" font-size="18" fill="#ECEFF4" font-weight="bold">Client App</text>

    <!-- Arrow 1: Request -->
    <line x1="180" y1="95" x2="280" y2="95" stroke="#ECEFF4" stroke-width="2.5" />
    <polygon points="280,95 270,90 270,100" fill="#ECEFF4" />
    <text x="200" y="85" font-family="system-ui, sans-serif" font-size="11" fill="#888888">1. GET /item</text>

    <!-- Cache Node (Amber with sketchy hachure) -->
    <rect x="290" y="55" width="140" height="80" rx="4" fill="#FFD166" fill-opacity="0.15" stroke="#FFD166" stroke-width="2.5" />
    <!-- Sketchy Hachure lines -->
    <line x1="300" y1="130" x2="370" y2="60" stroke="#FFD166" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="320" y1="130" x2="390" y2="60" stroke="#FFD166" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="340" y1="130" x2="410" y2="60" stroke="#FFD166" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="360" y1="130" x2="425" y2="65" stroke="#FFD166" stroke-width="1.5" stroke-opacity="0.4" />
    <text x="325" y="98" font-family="'Caveat', cursive, sans-serif" font-size="18" fill="#ECEFF4" font-weight="bold">Redis Cache</text>

    <!-- Diamond Decision Node (Coral) -->
    <polygon points="510,55 570,95 510,135 450,95" fill="#FF6B6B" fill-opacity="0.2" stroke="#FF6B6B" stroke-width="2.5" />
    <text x="490" y="98" font-family="'Caveat', cursive, sans-serif" font-size="15" fill="#ECEFF4">Hit?</text>

    <!-- Arrow to Diamond -->
    <line x1="430" y1="95" x2="450" y2="95" stroke="#ECEFF4" stroke-width="2" />

    <!-- DB Storage Node (Green Ellipse) -->
    <ellipse cx="510" cy="240" rx="80" ry="40" fill="#06D6A0" fill-opacity="0.15" stroke="#06D6A0" stroke-width="2.5" />
    <ellipse cx="510" cy="240" rx="78" ry="38" fill="none" stroke="#06D6A0" stroke-width="1" stroke-dasharray="6 3" />
    <text x="460" y="244" font-family="'Caveat', cursive, sans-serif" font-size="18" fill="#ECEFF4" font-weight="bold">Postgres DB</text>

    <!-- Miss Arrow -->
    <line x1="510" y1="135" x2="510" y2="200" stroke="#FF6B6B" stroke-width="2.5" />
    <polygon points="510,200 505,190 515,190" fill="#FF6B6B" />
    <text x="520" y="165" font-family="system-ui, sans-serif" font-size="11" fill="#FF6B6B">No (Miss)</text>

    <!-- Freehand Velocity Pen Annotation -->
    <path d="M 120,220 C 160,200 240,210 280,240 S 360,260 410,240" fill="none" stroke="#A78BFA" stroke-width="3" stroke-linecap="round" />
    <text x="130" y="260" font-family="'Caveat', cursive, sans-serif" font-size="16" fill="#A78BFA">read-through cache fallback ~5ms</text>
  </g>

  <!-- Bottom Status Bar -->
  <rect x="0" y="516" width="960" height="24" fill="#181818" />
  <text x="24" y="532" font-family="system-ui, sans-serif" font-size="11" fill="#666666">Ruqa v0.1.0 • algorithms/dijkstra.ruqa (saved) • 100% • 60 FPS • Pure CPU (tiny-skia)</text>
  <text x="830" y="532" font-family="system-ui, sans-serif" font-size="11" fill="#666666">Press V, P, R, D, O, E</text>
</svg>
