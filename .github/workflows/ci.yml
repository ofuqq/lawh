name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Configure Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting (rustfmt)
        run: cargo fmt --all --check

      - name: Run linter (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run unit and integration tests
        run: cargo test --workspace

      - name: Install xvfb for headless smoke test
        run: sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dev libxkbcommon-x11-0 libxkbcommon-dev

      - name: Smoke test — winit event loop starts and exits cleanly
        # Pumps 5 RedrawRequested frames through a real winit+softbuffer event
        # loop under a virtual framebuffer. Exits 0 on success, 1 on error.
        # Covers issue #47.
        run: xvfb-run --auto-servernum cargo run -p ruqa-app -- --smoke-test 5

  cargo-deny:
    name: License and Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check licenses and dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.0.11
        with:
          command: check
          arguments: --all-features
          command-arguments: licenses bans sources
