name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Configure Cargo cache
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7

      - name: Check formatting (rustfmt)
        run: cargo fmt --all --check

      - name: Run linter (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run unit and integration tests
        run: cargo test --workspace

      - name: Install xvfb for headless smoke test
        run: sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dev libxkbcommon-x11-0 libxkbcommon-dev

      - name: Smoke test — winit event loop starts and exits cleanly
        # Pumps 5 RedrawRequested frames through a real winit+softbuffer event
        # loop under a virtual framebuffer. Exits 0 on success, 1 on error.
        # Covers issue #47.
        run: xvfb-run --auto-servernum cargo run -p ruqa-app -- --smoke-test 5

  cargo-deny:
    name: License and Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check licenses and dependencies
        uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb # v2.0.11
        with:
          command: check
          arguments: --all-features
          command-arguments: licenses bans sources
